<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>三周年</title>
<style>
  :root{
    --bg1:#fff6f8;
    --bg2:#ffe9ef;
    --paper:#fffdfb;
    --ink:#4a3f42;
    --ink-soft:#5b4c50;
    --rose:#e8899e;
    --rose-deep:#d76b85;
    --gold:#c9a86a;
    --envelope:#fdf3f0;
    --envelope-shade:#f3e3de;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"华文楷体","KaiTi","STKaiti",serif;
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,#ffe3ea 100%);
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }
  #petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  /* ---------- 信封场景 ---------- */
  .scene{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .9s ease, transform .9s ease;
  }
  .scene.hide{opacity:0;transform:scale(1.04);pointer-events:none}

  .hint-top{
    font-family:"华文宋体","STSong","SimSun",serif;
    font-size:15px;letter-spacing:.5em;color:var(--rose);
    opacity:.75;margin-bottom:6vh;text-indent:.5em;
  }
  .envelope-wrap{
    position:relative;width:min(74vw,320px);height:min(52vw,224px);
    perspective:1200px;
    cursor:pointer;
  }
  .envelope{
    position:absolute;inset:0;
    background:var(--envelope);
    border-radius:6px;
    box-shadow:0 18px 40px -18px rgba(180,110,130,.45), 0 2px 0 #fff inset;
    transform-style:preserve-3d;
  }
  /* 信封底部的折角 */
  .envelope::before,
  .envelope::after{
    content:"";position:absolute;bottom:0;width:52%;height:78%;
    background:linear-gradient(135deg,var(--envelope-shade),transparent 65%);
    opacity:.55;
  }
  .envelope::before{left:0;clip-path:polygon(0 100%,100% 100%,0 0)}
  .envelope::after{right:0;clip-path:polygon(0 100%,100% 100%,100% 0)}

  .flap{
    position:absolute;left:0;top:0;width:100%;height:62%;
    background:linear-gradient(180deg,#fffaf8 0%,#f9e9e4 70%,#f2ddd7 100%);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform .9s cubic-bezier(.6,.05,.25,1);
    border-radius:6px 6px 0 0;
    z-index:3;
    filter:drop-shadow(0 2px 3px rgba(190,140,150,.28));
  }
  .seal{
    position:absolute;left:50%;top:52%;width:46px;height:46px;
    margin-left:-23px;margin-top:-23px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f093a6,var(--rose-deep));
    box-shadow:0 3px 10px rgba(200,90,120,.40);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:19px;z-index:4;
    font-family:"华文宋体","STSong",serif;
    cursor:pointer;
    transition:transform .18s ease;
  }
  .seal::after{content:"♡"}
  .seal:active{transform:scale(.94)}

  @keyframes sealFall{
    0%  {transform:none;opacity:1}
    16% {transform:translateY(-6px) rotate(-6deg) scale(1.08)}
    58% {transform:translateY(72px) rotate(14deg) scale(.96);opacity:.85}
    100%{transform:translateY(210px) rotate(32deg) scale(.72);opacity:0}
  }
  .seal.break{animation:sealFall .78s cubic-bezier(.45,.05,.7,1) forwards;pointer-events:none}

  .tap-hint{
    margin-top:7vh;font-size:15px;color:var(--ink-soft);opacity:.7;
    letter-spacing:.28em;text-indent:.28em;
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}

  .opened .flap{transform:rotateX(-172deg)}
  .opened .tap-hint{opacity:0;transition:opacity .3s}

  /* ---------- 信纸场景 ---------- */
  .letter-scene{
    position:fixed;inset:0;z-index:3;
    /* 半透明，让背后的花瓣透出来 */
    background:linear-gradient(170deg,rgba(255,248,244,.40) 0%,rgba(255,243,241,.33) 45%,rgba(255,238,241,.44) 100%);
    opacity:0;pointer-events:none;
    transition:opacity 1s ease;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .letter-scene.show{opacity:1;pointer-events:auto}

  .paper{
    width:min(88vw,560px);
    margin:0 auto;
    padding:11vh 7vw 14vh;
  }
  .salutation{
    font-family:"华文宋体","STSong","SimSun",serif;
    font-size:clamp(19px,5.4vw,25px);
    color:var(--ink);
    letter-spacing:.04em;
    margin-bottom:2.2em;
  }
  .para{ margin-bottom:1.5em; }
  .line{
    display:block;
    opacity:0;
    transform:translateY(14px);
    filter:blur(3px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.22,.7,.3,1), filter 1.1s ease;
    font-size:clamp(16.5px,4.5vw,20px);
    line-height:2.15;
    color:var(--ink-soft);
    text-align:justify;
    text-justify:inter-ideograph;
    letter-spacing:.02em;  }
  .line.in{opacity:1;transform:none;filter:blur(0)}

  .sign-wrap{
    margin-top:3.2em;text-align:right;
    opacity:0;transform:translateY(10px);
    transition:opacity 1.4s ease, transform 1.4s ease;
  }
  .sign-wrap.in{opacity:1;transform:none}
  .sign-love{
    font-size:clamp(21px,5.6vw,26px);color:var(--rose-deep);
    letter-spacing:.12em;margin-bottom:.55em;
  }
  .sign-name,.sign-date{
    font-family:"华文仿宋","FangSong",serif;
    font-size:clamp(13px,3.7vw,15px);color:#8a7b7f;line-height:1.9;
  }
  .sign-seal{
    width:44px;height:44px;margin:1.4em 0 0 auto;
    border:2px solid rgba(200,70,90,.55);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:rgba(200,70,90,.8);font-family:"华文宋体",serif;font-size:19px;
  }
  .petal-more{
    position:fixed;left:0;right:0;bottom:0;height:12vh;pointer-events:none;
    background:linear-gradient(to top,#fff3f1,transparent);
    opacity:0;transition:opacity 1.2s ease;z-index:4;
  }
  .petal-more.show{opacity:1}

  /* 调试用：?scene=letter 或 ?instant=1 时关掉过渡，便于静态截图 */
  .notrans *, .notrans *::before, .notrans *::after{
    transition:none !important; animation:none !important;
  }

  /* 音乐开关 */
  .bgm-btn{
    position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(214,140,160,.5);
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    color:#d76b85;font-size:15px;line-height:1;z-index:9;
    opacity:0;pointer-events:none;transition:opacity .8s ease;
    box-shadow:0 2px 8px rgba(200,140,160,.22);
  }
  .bgm-btn.show{opacity:1;pointer-events:auto}
  .bgm-btn.off{color:#c0aeb3;border-color:rgba(190,180,183,.5)}
  .bgm-btn.off::after{
    content:"";position:absolute;width:21px;height:1.5px;border-radius:2px;
    background:#c0aeb3;transform:rotate(-45deg);
  }
</style>
</head>
<body>

<canvas id="petals"></canvas>

<!-- ============ 信封 ============ -->
<div class="scene" id="scene">
  <div class="hint-top">三 周 年</div>
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope">
      <div class="flap"></div>
    </div>
    <div class="seal" id="seal"></div>
  </div>
  <div class="tap-hint" id="tapHint">轻 触 打 开</div>
</div>

<!-- ============ 信纸 ============ -->
<div class="letter-scene" id="letterScene">
  <audio id="bgm" src="bgm.mp3" preload="none"></audio>
  <button class="bgm-btn" id="bgmBtn" aria-label="音乐开关">♪</button>
  <div class="paper" id="paper">
    <div class="salutation" id="salutation"></div>
    <div id="body"></div>
    <div class="sign-wrap" id="sign">
      <div class="sign-love">我爱你</div>
      <div class="sign-name">你的宇斯卷小吴</div>
      <div class="sign-date">2026年11月3日</div>
      <div class="sign-seal">吴</div>
    </div>
  </div>
  <div class="petal-more" id="petalMore"></div>
</div>

<script>
/* ================= 文字 ================= */
const SALUTATION = "亲爱的王新楠宝宝：";
const PARAS = [
  "今天是我们在一起三周年的日子。写这封信的时候，我脑子里翻来覆去都是这三年里那些很普通的瞬间：一起吃饭时你随口说的一句笑话，走路时你习惯性牵过来的手，我情绪不好的时候你笨拙但认真的安慰。好像没有什么惊天动地的大事，可就是这些小事，一点点把我们变成了现在这个样子。",
  "这三年，谢谢你愿意陪在我身边。谢谢你包容我的坏脾气和那些没头没脑的时刻，也谢谢你在我不够好的时候，没有急着否定我，而是陪着我慢慢改。我知道我有时候嘴笨、反应慢，很多话当时没说出口，但其实我都记得，记得你为我做过的那些小事，记得你在我身边时，我心里那种踏实的感觉。",
  "我们也有过争执和别扭，有过谁也不理谁的时候。可每次和好之后，我都会更确定一点就是我是真的想和你一直走下去。不是因为你永远完美，而是因为就算看到彼此不完美的样子，我们还是愿意选择对方。🫰🏻",
  "宝宝，三周年快乐。谢谢你出现在我的生活里，也谢谢你愿意让我参与你的生活。希望下一个三年、再下一个三年，我们还能像现在这样，牵着的手不松开。"
];

const params = new URLSearchParams(location.search);
const INSTANT = params.get('instant') === '1' || params.get('scene') === 'letter';
if (INSTANT) document.documentElement.classList.add('notrans');

/* ================= 花瓣 ================= */
(function petals(){
  const cvs = document.getElementById('petals');
  const ctx = cvs.getContext('2d');
  let W, H, dpr, items = [];

  const COLORS = [
    ['#ffd3de','#ffb6c9'],
    ['#ffe0e8','#ffc3d3'],
    ['#ffc9d8','#f7a8bd'],
    ['#fff0f4','#ffd9e2']
  ];

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build();
  }

  function build(){
    const n = Math.max(16, Math.min(34, Math.round(W * H / 26000)));
    items = [];
    for (let i = 0; i < n; i++) items.push(spawn(true));
  }

  function spawn(init){
    const size = 7 + Math.random() * 9;
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -30,
      r: size,
      vy: 12 + Math.random() * 26,          // px/s
      vx: -14 + Math.random() * 28,
      sway: 0.5 + Math.random() * 1.4,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      vr: (-0.9 + Math.random() * 1.8),
      c: COLORS[(Math.random() * COLORS.length) | 0],
      a: 0.55 + Math.random() * 0.4
    };
  }

  let last = performance.now();
  function tick(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < items.length; i++){
      const p = items[i];
      p.phase += dt * p.sway;
      p.y += p.vy * dt;
      p.x += (p.vx + Math.sin(p.phase) * 16) * dt;
      p.rot += p.vr * dt;
      if (p.y > H + 40 || p.x < -60 || p.x > W + 60){
        items[i] = spawn(false);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.a;
      const g = ctx.createLinearGradient(-p.r, -p.r, p.r, p.r);
      g.addColorStop(0, p.c[0]); g.addColorStop(1, p.c[1]);
      ctx.fillStyle = g;
      // 花瓣形状：两段贝塞尔
      ctx.beginPath();
      ctx.moveTo(0, -p.r);
      ctx.bezierCurveTo(p.r * 0.95, -p.r * 0.5, p.r * 0.75, p.r * 0.6, 0, p.r);
      ctx.bezierCurveTo(-p.r * 0.75, p.r * 0.6, -p.r * 0.95, -p.r * 0.5, 0, -p.r);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);
})();

/* ================= 逐行拆行 ================= */
function splitLines(container, text){
  // 逐字测量纵向中心线，按容差归组，得到真实的视觉行
  const probe = document.createElement('div');
  probe.className = 'line';
  probe.style.opacity = '1';
  probe.style.transform = 'none';
  probe.style.filter = 'none';
  probe.style.visibility = 'hidden';
  probe.textContent = text;
  container.appendChild(probe);

  const cs = getComputedStyle(probe);
  const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.8;
  const tol = lh * 0.6;

  const node = probe.firstChild;
  const range = document.createRange();
  const centers = [];
  for (let i = 0; i < text.length; i++){
    range.setStart(node, i);
    range.setEnd(node, i + 1);
    const rects = range.getClientRects();
    centers.push(rects.length ? (rects[0].top + rects[0].bottom) / 2 : null);
  }
  container.removeChild(probe);

  const groups = [];
  let cur = [];
  let anchor = null;
  for (let i = 0; i < centers.length; i++){
    const c = centers[i];
    if (c === null) { if (cur.length) cur.push(i); continue; }
    if (anchor === null || Math.abs(c - anchor) <= tol){
      if (anchor === null) anchor = c;
      cur.push(i);
    } else {
      groups.push(cur);
      cur = [i];
      anchor = c;
    }
  }
  if (cur.length) groups.push(cur);

  return groups
    .map(g => text.slice(g[0], g[g.length - 1] + 1))
    .map(s => s.replace(/^\s+|\s+$/g, ''))
    .filter(Boolean);
}

/* ================= 组装 ================= */
const body = document.getElementById('body');
const salEl = document.getElementById('salutation');
const signEl = document.getElementById('sign');
let queue = [];

function build(){
  salEl.textContent = SALUTATION;
  body.innerHTML = '';
  queue = [];
  PARAS.forEach(p => {
    const box = document.createElement('div');
    box.className = 'para';
    body.appendChild(box);
    const lines = splitLines(box, p);
    lines.forEach(t => {
      const el = document.createElement('span');
      el.className = 'line';
      el.textContent = t;
      box.appendChild(el);
      queue.push(el);
    });
  });
  queue.push(signEl);
}

/* ================= 播放 ================= */
let playing = false;
function play(){
  if (playing) return;
  playing = true;
  let i = 0;
  const step = () => {
    if (i >= queue.length){
      document.getElementById('petalMore').classList.add('show');
      return;
    }
    const el = queue[i++];
    el.classList.add('in');
    const isSign = el === signEl;
    setTimeout(step, isSign ? 0 : (INSTANT ? 0 : 820));
  };
  step();
}

/* ================= 音乐 ================= */
const bgm = document.getElementById('bgm');
const bgmBtn = document.getElementById('bgmBtn');
let bgmStarted = false, bgmOn = true, fadeTimer = null, pauseTimer = null;

function fadeTo(target, ms){
  clearInterval(fadeTimer);
  const steps = Math.max(1, Math.round(ms / 80));
  const from = bgm.volume;
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    bgm.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps)));
    if (i >= steps) clearInterval(fadeTimer);
  }, 80);
}

function startBgm(){
  if (bgmStarted) return;
  bgmStarted = true;
  bgm.muted = false;
  try { bgm.volume = 0; bgm.play(); } catch (e) {}
  fadeTo(0.55, 2000);
  setTimeout(() => bgmBtn.classList.add('show'), 1400);
}

// iOS 微信：桥就绪后再补一次播放
document.addEventListener('WeixinJSBridgeReady', () => {
  if (bgmStarted && bgm.paused && bgmOn) { try { bgm.play(); } catch (e) {} }
}, false);

bgmBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  e.preventDefault();
  bgmOn = !bgmOn;
  bgmBtn.classList.toggle('off', !bgmOn);

  if (bgmOn){
    clearTimeout(pauseTimer);
    bgm.muted = false;                    // 关键：iOS 不认 volume，只认 muted
    if (bgm.paused) { try { bgm.play(); } catch (err) {} }
    fadeTo(0.55, 700);
  } else {
    fadeTo(0, 450);
    clearTimeout(pauseTimer);
    // 淡出只是听觉上的体面；真正静音靠 muted + pause，全平台有效
    pauseTimer = setTimeout(() => {
      if (!bgmOn) { bgm.muted = true; try { bgm.pause(); } catch (err) {} }
    }, 470);
  }
});

/* ================= 开场 ================= */
const scene = document.getElementById('scene');
const letterScene = document.getElementById('letterScene');
const wrap = document.getElementById('envelopeWrap');
const seal = document.getElementById('seal');
let opened = false;

function open(){
  if (opened) return;
  opened = true;
  startBgm();

  // 1) 火漆脱落
  seal.classList.add('break');

  // 2) 封盖翻开
  setTimeout(() => wrap.classList.add('opened'), 430);

  // 3) 信纸淡入
  setTimeout(() => {
    scene.classList.add('hide');
    letterScene.classList.add('show');
    letterScene.scrollTop = 0;
    build();
    if (INSTANT) {
      queue.forEach(e => e.classList.add('in'));
      document.getElementById('petalMore').classList.add('show');
    } else {
      setTimeout(play, 420);
    }
  }, 1330);
}

seal.addEventListener('click', (e) => { e.stopPropagation(); open(); });
wrap.addEventListener('click', open);

// 直接进入信纸（用于调试/预览）
if (params.get('scene') === 'letter'){
  scene.style.display = 'none';
  letterScene.classList.add('show');
  build();
  queue.forEach(e => e.classList.add('in'));
  document.getElementById('petalMore').classList.add('show');
}

// 屏幕大了重排：只在还没开始播时重建
let rt;
window.addEventListener('resize', () => {
  if (!letterScene.classList.contains('show') || playing) return;
  clearTimeout(rt);
  rt = setTimeout(() => { build(); queue.forEach(e => e.classList.add('in')); }, 240);
});
</script>
</body>
</html>
